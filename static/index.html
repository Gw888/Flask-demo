<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>人员管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css"/>
  <style>
    body { margin: 40px; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; }
    .container { max-width: 900px; margin: auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 8px #0001; }
    h1 { text-align: center; margin-bottom: 32px; }
    .table-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="container">
    <h1>人员管理</h1>
    <form class="row g-3 mb-3" id="searchForm">
      <div class="col-auto">
        <input type="text" class="form-control" id="searchUsername" placeholder="用户名">
      </div>
      <div class="col-auto">
        <input type="text" class="form-control" id="searchEmail" placeholder="邮箱">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-secondary">搜索</button>
      </div>
    </form>
    <div class="mb-3 text-end">
      <button class="btn btn-primary" id="addUserBtn">新增用户</button>
    </div>
    <table class="table table-bordered" id="userTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>用户名</th>
          <th>邮箱</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <nav>
      <ul class="pagination justify-content-end" id="pagination"></ul>
    </nav>
  </div>

  <!-- 用户表单 -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">新增用户</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="userForm">
            <input type="hidden" id="userId">
            <div class="mb-3">
              <label for="username" class="form-label">用户名</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">邮箱</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">密码</label>
              <input type="password" class="form-control" id="password">
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script>
    let page = 1, pageSize = 2, total = 0;
    let editingId = null;
    const $userModal = new bootstrap.Modal(document.getElementById('userModal'));
    let searchUsername = '', searchEmail = '';

    function fetchUsers() {
      $.get(`/api/users?page=${page}&page_size=${pageSize}&username=${encodeURIComponent(searchUsername)}&email=${encodeURIComponent(searchEmail)}`,
        function(res) {
        const items = res.data.items || res.data;
        total = res.data.total || res.data.length || 0;
        const $tbody = $('#userTable tbody').empty();
        items.forEach(user => {
          $tbody.append(`
            <tr>
              <td>${user.id}</td>
              <td>${user.username}</td>
              <td>${user.email}</td>
              <td>
                <button class="btn btn-sm btn-info me-1 edit-btn" data-id="${user.id}" data-username="${user.username}" data-email="${user.email}">编辑</button>
                <button class="btn btn-sm btn-danger delete-btn" data-id="${user.id}">删除</button>
              </td>
            </tr>
          `);
        });
        renderPagination();
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(total / pageSize);
      const $pagination = $('#pagination').empty();
      for (let i = 1; i <= totalPages; i++) {
        $pagination.append(`<li class="page-item${i===page?' active':''}"><a class="page-link" href="#">${i}</a></li>`);
      }
    }

    // 分页点击
    $('#pagination').on('click', 'a', function(e) {
      e.preventDefault();
      const idx = parseInt($(this).text());
      if (idx !== page) {
        page = idx;
        fetchUsers();
      }
    });

    // 新增用户按钮
    $('#addUserBtn').click(function() {
      editingId = null;
      $('#userModalTitle').text('新增用户');
      $('#userId').val('');
      $('#username').val('');
      $('#email').val('');
      $('#password').val('');
      $userModal.show();
    });

    // 编辑按钮
    $('#userTable').on('click', '.edit-btn', function() {
      editingId = $(this).data('id');
      $('#userModalTitle').text('编辑用户');
      $('#userId').val(editingId);
      $('#username').val($(this).data('username'));
      $('#email').val($(this).data('email'));
      $('#password').val('');
      $userModal.show();
    });

    // 删除按钮
    $('#userTable').on('click', '.delete-btn', function() {
      if (confirm('确定要删除该用户吗？')) {
        $.ajax({
          url: `/api/users/${$(this).data('id')}`,
          type: 'DELETE',
          success: function() {
            fetchUsers();
            alert('删除成功');
          },
          error: function(xhr) {
            let msg = '请求失败';
            if (xhr.responseJSON && xhr.responseJSON.message) {
              msg = xhr.responseJSON.message;
            }
            alert('删除失败：' + msg);
          }
        });
      }
    });

    // 表单提交
    $('#userForm').submit(function(e) {
      e.preventDefault();
      const id = $('#userId').val();
      const data = {
        username: $('#username').val(),
        email: $('#email').val(),
      };
      const password = $('#password').val();
      if (!id || password) data.password = password;
      if (editingId) {
        $.ajax({
          url: `/api/users/${editingId}`,
          type: 'PUT',
          contentType: 'application/json',
          data: JSON.stringify(data),
          success: function() {
            $userModal.hide();
            fetchUsers();
            alert('编辑成功');
          },
          error: function(xhr) {
            let msg = '请求失败';
            if (xhr.responseJSON && xhr.responseJSON.message) {
              msg = xhr.responseJSON.message;
            }
            alert('编辑失败：' + msg);
          }
        });
      } else {
        $.ajax({
          url: '/api/users',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(data),
          success: function() {
            $userModal.hide();
            fetchUsers();
            alert('新增成功');
          },
          error: function(xhr) {
            let msg = '请求失败';
            if (xhr.responseJSON && xhr.responseJSON.message) {
              msg = xhr.responseJSON.message;
            }
            alert('新增失败：' + msg);
          }
        });
      }
    });

    // 搜索表单提交
    $('#searchForm').submit(function(e) {
      e.preventDefault();
      searchUsername = $('#searchUsername').val();
      searchEmail = $('#searchEmail').val();
      page = 1;
      fetchUsers();
    });

    // 初始化
    fetchUsers();
  </script>
</body>
</html>
